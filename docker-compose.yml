# Compose file for one-command local runs:
#   cp .env.example .env   # fill in LLM_BASE_URL / LLM_API_KEY
#   docker compose up --build
#
# Prod build served by the Node server on http://localhost:8080, which also
# hosts /api/llm (keys never reach the browser) and /api/store (Postgres).
services:
  postgres:
    image: postgres:16-alpine
    container_name: afra-postgres
    environment:
      POSTGRES_USER: afra
      POSTGRES_PASSWORD: afra
      POSTGRES_DB: afra
    volumes:
      - afra_pg_data:/var/lib/postgresql/data
    ports:
      # Only exposed for local psql / GUI access; the app talks over the
      # docker network via the `postgres` service name.
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U afra -d afra"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  afra:
    build:
      context: .
      dockerfile: Dockerfile
    image: afra-diff-analyzer:latest
    container_name: afra
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8787"
    env_file:
      - path: .env
        required: false
    environment:
      # Override the .env DATABASE_URL when running in compose so the container
      # reaches Postgres by service name rather than localhost.
      DATABASE_URL: postgres://afra:afra@postgres:5432/afra
      # Pin the debug-log dir to a path we mount below so log files land on
      # the host filesystem instead of the container's writable layer (where
      # `docker compose down` would silently discard them).
      LLM_LOG_DIR: /app/logs
    volumes:
      # Container writes → host at ./logs. The Node server does `mkdirSync` on
      # first request, so the host dir is created on demand and doesn't need
      # to exist ahead of time.
      - ./logs:/app/logs
    restart: unless-stopped

volumes:
  afra_pg_data:
