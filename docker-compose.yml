# Compose file for one-command local runs:
#   cp .env.example .env   # fill in LLM_BASE_URL / LLM_API_KEY
#   docker compose up --build
#
# Prod build served by the Node server on http://localhost:8080, which also
# hosts the /api/llm proxy so the key never reaches the browser.
services:
  afra:
    build:
      context: .
      dockerfile: Dockerfile
    image: afra-diff-analyzer:latest
    container_name: afra
    ports:
      - "8080:8787"
    env_file:
      - path: .env
        required: false
    restart: unless-stopped
